name: Report a documentation/runtime discrepancy
description: Compare an official claim with a reproducible runtime observation.
title: "Documentation/runtime discrepancy: [agent] [capability]"
labels: [documentation]
body:
  - type: textarea
    id: claim
    attributes:
      label: Official documentation claim and URL
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Runtime observation
      description: Include exact agent/test versions, OS, command, result JSON, and redacted evidence.
    validations:
      required: true
