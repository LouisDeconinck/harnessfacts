# Copy to .github/workflows/compatibility.yml after v0.1.0 is published.
name: Coding agent compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: LouisDeconinck/harnessfacts/check@v0.1.0
        with:
          agent: codex
          version: '0.153.4'
          platform: linux
          require: |
            instructions.root
            instructions.nested
            mcp.stdio
